<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="34%" cy="26%" r="66%">
      <stop offset="0%"   stop-color="#152436"/>
      <stop offset="100%" stop-color="#0C1118"/>
    </radialGradient>
    <!-- Glow para los dedos -->
    <filter id="fg" x="-50%" y="-40%" width="200%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Gradiente borde del cuadrado -->
    <linearGradient id="bd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="rgba(56,189,248,0.35)"/>
      <stop offset="55%"  stop-color="rgba(56,189,248,0.08)"/>
      <stop offset="100%" stop-color="rgba(56,189,248,0.20)"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Acento esquina superior -->
  <path d="M24,0.8 L76,0.8 Q99,0.8 99,24" fill="none"
        stroke="rgba(56,189,248,0.25)" stroke-width="1.2"/>
  <!-- Borde -->
  <rect width="100" height="100" rx="22" fill="none"
        stroke="url(#bd)" stroke-width="1.4"/>

  <!-- ══ Seña Y: palma + meñique + pulgar ══ -->

  <!-- Palma (masa central) -->
  <path d="M30,46 L70,46 Q73,48 71,62 L65,82 L35,82 L29,62 Q27,48 30,46 Z"
        fill="rgba(56,189,248,0.22)" stroke="#38BDF8" stroke-width="1.8"
        stroke-linejoin="round"/>

  <!-- Dedos medio/anular/índice — stubs doblados (muy sutiles) -->
  <rect x="41" y="38" width="10" height="10" rx="5" fill="rgba(56,189,248,0.14)"/>
  <rect x="53" y="37" width="10" height="11" rx="5" fill="rgba(56,189,248,0.14)"/>

  <!-- Meñique extendido (arriba-izquierda) — con glow -->
  <rect x="14" y="8"  width="15" height="46" rx="7.5"
        fill="rgba(56,189,248,0.90)" filter="url(#fg)"/>
  <!-- articulaciones del meñique -->
  <rect x="15" y="34" width="13" height="2.5" rx="1.2" fill="rgba(9,14,22,0.45)" stroke="none"/>
  <rect x="15" y="22" width="13" height="2.5" rx="1.2" fill="rgba(9,14,22,0.35)" stroke="none"/>
  <!-- punta meñique -->
  <ellipse cx="21.5" cy="11" rx="5" ry="3" fill="rgba(210,242,255,0.55)" stroke="none"/>

  <!-- Pulgar extendido (abajo-derecha, angulado) — con glow -->
  <rect x="64" y="46" width="15" height="36" rx="7.5"
        fill="rgba(56,189,248,0.90)" filter="url(#fg)"
        transform="rotate(32,71.5,64)"/>
  <!-- punta pulgar -->
  <ellipse cx="69" cy="50" rx="5" ry="3" fill="rgba(210,242,255,0.55)" stroke="none"
           transform="rotate(32,71.5,64)"/>
</svg>
