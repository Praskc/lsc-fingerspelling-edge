server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    set $csp "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com https://api.datamuse.com; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; frame-ancestors 'none'";
    set $permissions_policy "camera=(self), microphone=(), geolocation=(), accelerometer=(), gyroscope=(), magnetometer=(), payment=(), usb=(), interest-cohort=()";

    # Vite-hashed assets (JS/CSS bundles) — immutable, cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control                "public, immutable";
        add_header Cross-Origin-Opener-Policy   "same-origin"                         always;
        add_header Cross-Origin-Embedder-Policy "require-corp"                        always;
        add_header X-Content-Type-Options       "nosniff"                             always;
        add_header X-Frame-Options              "DENY"                                always;
        add_header Referrer-Policy              "strict-origin-when-cross-origin"     always;
        add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains" always;
        add_header Cross-Origin-Resource-Policy "same-origin"                         always;
        add_header Permissions-Policy           $permissions_policy                   always;
        add_header Content-Security-Policy      $csp                                  always;
    }

    # Model files — no hash in filename, cache 7 days
    location ~* \.(onnx|json)$ {
        expires 7d;
        add_header Cache-Control                "public";
        add_header Cross-Origin-Opener-Policy   "same-origin"                         always;
        add_header Cross-Origin-Embedder-Policy "require-corp"                        always;
        add_header X-Content-Type-Options       "nosniff"                             always;
        add_header X-Frame-Options              "DENY"                                always;
        add_header Referrer-Policy              "strict-origin-when-cross-origin"     always;
        add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains" always;
        add_header Cross-Origin-Resource-Policy "same-origin"                         always;
        add_header Permissions-Policy           $permissions_policy                   always;
        add_header Content-Security-Policy      $csp                                  always;
    }

    # Service worker — never cache; must always revalidate
    location = /sw.js {
        add_header Cache-Control                "no-cache, no-store, must-revalidate";
        add_header Cross-Origin-Opener-Policy   "same-origin"                         always;
        add_header Cross-Origin-Embedder-Policy "require-corp"                        always;
        add_header X-Content-Type-Options       "nosniff"                             always;
        add_header X-Frame-Options              "DENY"                                always;
        add_header Referrer-Policy              "strict-origin-when-cross-origin"     always;
        add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains" always;
        add_header Cross-Origin-Resource-Policy "same-origin"                         always;
        add_header Permissions-Policy           $permissions_policy                   always;
        add_header Content-Security-Policy      $csp                                  always;
    }

    # SPA fallback — HTML always revalidates, COOP/COEP on every response
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control                "no-cache";
        add_header Cross-Origin-Opener-Policy   "same-origin"                         always;
        add_header Cross-Origin-Embedder-Policy "require-corp"                        always;
        add_header X-Content-Type-Options       "nosniff"                             always;
        add_header X-Frame-Options              "DENY"                                always;
        add_header Referrer-Policy              "strict-origin-when-cross-origin"     always;
        add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains" always;
        add_header Cross-Origin-Resource-Policy "same-origin"                         always;
        add_header Permissions-Policy           $permissions_policy                   always;
        add_header Content-Security-Policy      $csp                                  always;
    }
}
