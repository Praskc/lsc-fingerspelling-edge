<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>YOSO · You Only Sign Once</title>
  <meta name="description" content="YOSO. Reconocimiento del alfabeto dactilológico LSC en tiempo real, 100% en el navegador. Desarrollado en Sincelejo.">
  <meta name="theme-color" content="#1c1816">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">

  <link rel="preload" href="/YOSO.onnx" as="fetch" crossorigin="anonymous" fetchpriority="high">
  <link rel="preload" href="/Centroides.json" as="fetch" crossorigin="anonymous" fetchpriority="high">

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=Geist:wght@400;500;600;700&family=Departure+Mono&display=swap" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=Geist:wght@400;500;600;700&family=Departure+Mono&display=swap" crossorigin="anonymous">

  <link rel="stylesheet" href="/src/styles/index.css">
</head>
<body>

  <div id="splash-screen" class="splash-screen">
    <div class="splash-inner">
      <span class="splash-status">Cargando motor</span>
      <span class="splash-wordmark">YOSO</span>
      <span class="splash-slogan">You only sign once</span>
      <span class="splash-meta">LSC · SINCELEJO · v2.0</span>
    </div>
  </div>

  <main id="app-shell">

    <nav id="tabs-bar" role="tablist" aria-label="Modos"></nav>

    <div id="workspace">
      <section id="panel-left"></section>
      <section id="panel-right">
        <div id="tab-traductor"     class="tab-panel active" role="tabpanel"></div>
        <div id="tab-entrenamiento" class="tab-panel"        role="tabpanel"></div>
        <div id="tab-aprendizaje"   class="tab-panel"        role="tabpanel"></div>
      </section>
    </div>

  </main>

  <div id="onboarding-root" role="dialog" aria-modal="true"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="/src/core/main.ts"></script>
</body>
</html>
